<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Subject Media - Operations Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1729;
    --bg-2: #0f2040;
    --panel: #101f36;
    --panel-2: #14263f;
    --panel-line: rgba(242,238,227,0.10);
    --panel-line-2: rgba(242,238,227,0.18);
    --cream: #f2eee3;
    --cream-bright: #f8f5ec;
    --fog: rgba(242,238,227,0.55);
    --fog-2: rgba(242,238,227,0.75);
    --blue: #2fa3e8;
    --blue-b: #4ec4ff;
    --blue-soft: rgba(78,196,255,0.12);
    --ok: #4ade80;
    --warn: #fbbf24;
    --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--cream); font-family: "Inter", sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 85% 0%, rgba(78,196,255,0.08) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    z-index: -1;
  }
  button { font-family: inherit; }

  /* ========== LOGIN GATE ========== */
  .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .gate-box { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--panel-line-2); border-radius: 16px; padding: 36px 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .gate-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .gate-brand-icon { width: 40px; height: 40px; background: var(--blue-soft); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--blue-b); }
  .gate-brand-txt h1 { font-family: "Anton", sans-serif; font-size: 22px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--cream-bright); line-height: 1; }
  .gate-brand-txt .gate-sub { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--fog); text-transform: uppercase; margin-top: 4px; }
  .field label { display: block; font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fog); margin-bottom: 8px; font-weight: 600; }
  .field input { width: 100%; background: rgba(242,238,227,0.04); border: 1px solid var(--panel-line-2); border-radius: 10px; padding: 13px 14px; color: var(--cream-bright); font: 500 15px "Inter", sans-serif; }
  .field input:focus { outline: none; border-color: var(--blue); background: rgba(78,196,255,0.05); }
  .gate .btn-unlock { width: 100%; padding: 14px; margin-top: 20px; background: var(--blue); color: var(--bg); border: 0; border-radius: 10px; font: 700 14px "Inter", sans-serif; letter-spacing: 0.03em; cursor: pointer; transition: background 0.15s; }
  .gate .btn-unlock:hover { background: var(--blue-b); }
  .gate .btn-unlock:disabled { opacity: 0.6; cursor: wait; }
  .err { color: var(--danger); font-size: 12.5px; margin-top: 14px; min-height: 18px; line-height: 1.4; }
  .hint { color: var(--fog); font-size: 11px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--panel-line); line-height: 1.5; }

  /* ========== APP SHELL ========== */
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 28px 60px; }

  .top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
  }
  .brand-block { display: flex; align-items: center; gap: 14px; }
  .brand-icon { width: 44px; height: 44px; background: var(--blue-soft); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--blue-b); }
  .brand-title { font-family: "Anton", sans-serif; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--cream-bright); line-height: 1; }
  .brand-sub { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--fog); text-transform: uppercase; margin-top: 5px; }

  .top-actions { display: flex; align-items: center; gap: 8px; }
  .status-pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--panel-line-2); color: var(--fog); }
  .status-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--fog); }
  .status-pill.ok { color: var(--ok); border-color: rgba(74,222,128,0.35); background: rgba(74,222,128,0.06); }
  .status-pill.ok::before { background: var(--ok); box-shadow: 0 0 0 4px rgba(74,222,128,0.10); }
  .status-pill.warn { color: var(--warn); border-color: rgba(251,191,36,0.35); background: rgba(251,191,36,0.06); }
  .status-pill.warn::before { background: var(--warn); }
  .status-pill.err { color: var(--danger); border-color: rgba(248,113,113,0.35); background: rgba(248,113,113,0.06); }
  .status-pill.err::before { background: var(--danger); }

  .btn { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--panel-line-2); background: transparent; color: var(--cream); font: 500 13px "Inter", sans-serif; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  .btn:hover { background: var(--panel); border-color: var(--fog); }
  .btn-primary { background: var(--blue); color: var(--bg); border-color: var(--blue); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary:hover { background: var(--blue-b); border-color: var(--blue-b); }
  .btn-icon { color: var(--fog); border: 1px solid var(--panel-line-2); background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .btn-icon:hover { color: var(--cream-bright); border-color: var(--fog); }

  .tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; margin-bottom: 24px; }
  .tab { padding: 9px 22px; border-radius: 8px; border: 0; background: transparent; color: var(--fog); font: 600 13px "Inter", sans-serif; cursor: pointer; transition: all 0.15s; }
  .tab:hover { color: var(--cream-bright); }
  .tab.active { background: var(--bg); color: var(--cream-bright); }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 20px 24px; display: flex; align-items: center; gap: 18px; }
  .kpi-icon { width: 46px; height: 46px; border-radius: 12px; background: var(--blue-soft); display: flex; align-items: center; justify-content: center; color: var(--blue-b); flex-shrink: 0; }
  .kpi-txt { flex: 1; min-width: 0; }
  .kpi-label { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.15em; color: var(--fog); text-transform: uppercase; margin-bottom: 6px; }
  .kpi-value { font-family: "Anton", sans-serif; font-size: 32px; color: var(--cream-bright); line-height: 1; letter-spacing: 0; }

  .filters { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; margin-bottom: 16px; }
  .filter-input { position: relative; }
  .filter-input .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fog); pointer-events: none; }
  .filter-input input {
    width: 100%; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px;
    padding: 11px 14px 11px 42px; color: var(--cream-bright); font: 500 13px "Inter", sans-serif;
  }
  .filter-input input:focus { outline: none; border-color: var(--blue); }
  .filter-select { position: relative; }
  .filter-select .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fog); pointer-events: none; z-index: 1; }
  .filter-select select {
    appearance: none; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px;
    padding: 11px 40px 11px 42px; color: var(--cream-bright); font: 500 13px "Inter", sans-serif; cursor: pointer;
    min-width: 170px;
  }
  .filter-select select:focus { outline: none; border-color: var(--blue); }
  .filter-select .chev { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--fog); pointer-events: none; }

  .table-card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
  th {
    text-align: left; padding: 14px 18px; font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.15em; color: var(--fog); text-transform: uppercase;
    border-bottom: 1px solid var(--panel-line); font-weight: 600; white-space: nowrap;
  }
  td { padding: 14px 18px; border-bottom: 1px solid var(--panel-line); color: var(--cream); vertical-align: middle; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: rgba(78,196,255,0.03); }
  td.name { color: var(--cream-bright); font-weight: 600; }
  td.email, td.phone, td.date, td.muted { color: var(--fog-2); font-family: "JetBrains Mono", monospace; font-size: 12.5px; }
  td.amount { color: var(--blue-b); font-family: "JetBrains Mono", monospace; font-weight: 700; }
  td.dash { color: var(--fog); font-family: "JetBrains Mono", monospace; }

  .status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font: 600 10px "JetBrains Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid; }
  .status-active { color: var(--ok); border-color: rgba(74,222,128,0.4); background: rgba(74,222,128,0.08); }
  .status-canceled { color: var(--danger); border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.08); }
  .status-trialing { color: var(--warn); border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.08); }
  .status-past_due { color: var(--danger); border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.08); }

  .empty { text-align: center; padding: 80px 20px; color: var(--fog); }
  .empty .big { font-family: "Anton", sans-serif; font-size: 22px; color: var(--cream-bright); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 8px; }

  .autoref { display: flex; align-items: center; gap: 8px; color: var(--fog); font-size: 12px; }
  .last-updated { color: var(--fog); font-size: 11px; font-family: "JetBrains Mono", monospace; letter-spacing: 0.05em; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--panel); border: 1px solid var(--blue); padding: 12px 18px; border-radius: 10px; font-size: 13px; color: var(--cream-bright); opacity: 0; transform: translateY(10px); transition: opacity 0.2s, transform 0.2s; z-index: 200; }
  .toast.show { opacity: 1; transform: translateY(0); }

  .row-secondary { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }

  @media (max-width: 720px) {
    .wrap { padding: 16px 14px 40px; }
    .brand-title { font-size: 22px; }
    .kpi-value { font-size: 26px; }
    .kpi { padding: 16px 18px; gap: 14px; }
    .filters { grid-template-columns: 1fr; }
    .filter-select select { width: 100%; }
    th, td { padding: 11px 14px; font-size: 12px; }
    .top-actions .status-pill { display: none; }
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-brand">
      <div class="gate-brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 L3 14 L12 14 L11 22 L21 10 L12 10 Z"/>
        </svg>
      </div>
      <div class="gate-brand-txt">
        <h1>Subject Media</h1>
        <div class="gate-sub">Operations Dashboard</div>
      </div>
    </div>
    <div class="field" style="margin-bottom: 4px;">
      <label>Admin Password</label>
      <input type="password" id="pw" autocomplete="current-password" />
    </div>
    <button type="button" id="unlockBtn" class="btn-unlock">Unlock</button>
    <div id="loginErr" class="err"></div>
    <div class="hint">
      Access requires the <code style="color:var(--cream-bright);font-family:'JetBrains Mono',monospace;">ADMIN_PASSWORD</code> env var set in your Vercel project.
    </div>
  </div>
</div>

<div class="wrap" id="app" style="display: none;">
  <div class="top">
    <div class="brand-block">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 L3 14 L12 14 L11 22 L21 10 L12 10 Z"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">Subject Media</div>
        <div class="brand-sub">Operations Dashboard</div>
      </div>
    </div>
    <div class="top-actions">
      <span id="status" class="status-pill warn">Loading</span>
      <button class="btn-primary" id="exportBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 L12 15 M6 9 L12 15 L18 9 M4 21 L20 21"/>
        </svg>
        Export CSV
      </button>
      <button class="btn-icon" id="lockBtn" type="button" title="Lock and sign out">Lock</button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="payments" type="button">Payments</button>
    <button class="tab" data-tab="subscriptions" type="button">Subscriptions</button>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="filters">
    <div class="filter-input">
      <span class="icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21 L16 16"/>
        </svg>
      </span>
      <input type="text" id="searchInput" placeholder="Search payments..." />
    </div>
    <div class="filter-select">
      <span class="icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2 L16 6 M8 2 L8 6 M3 10 L21 10"/>
        </svg>
      </span>
      <select id="timeFilter">
        <option value="2160">All Time</option>
        <option value="24">Last 24 hours</option>
        <option value="72">Last 3 days</option>
        <option value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
      </select>
      <span class="chev">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9 L12 15 L18 9"/></svg>
      </span>
    </div>
    <div class="filter-select">
      <span class="icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12 L15 5 L2 5 L2 12 L9 19 L22 12 Z"/><circle cx="7" cy="10" r="1.5" fill="currentColor"/>
        </svg>
      </span>
      <select id="productFilter">
        <option value="">All Products</option>
      </select>
      <span class="chev">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9 L12 15 L18 9"/></svg>
      </span>
    </div>
  </div>

  <div class="row-secondary">
    <span class="last-updated" id="lastUpdated">-</span>
    <label class="autoref" style="margin-left:auto;">
      <input type="checkbox" id="autoRefresh" checked />
      Auto-refresh 30s
    </label>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <div id="tableBody"><div class="empty"><div class="big">Loading</div><div>Fetching data from Stripe...</div></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var state = {
    activeTab: "payments",
    payments: [],
    subscriptions: [],
    customFieldLabels: [],
    products: [],
    activeCount: 0,
    mrrCents: 0,
    timer: null
  };

  function $(id) { return document.getElementById(id); }

  function toast(msg, kind) {
    var el = $("toast");
    el.textContent = msg;
    el.style.borderColor = kind === "err" ? "var(--danger)" : "var(--blue)";
    el.classList.add("show");
    setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function setStatus(kind, label) {
    var el = $("status");
    if (!el) return;
    el.className = "status-pill " + kind;
    el.textContent = label;
  }

  function getPw() { try { return sessionStorage.getItem("sm_pw") || ""; } catch (e) { return ""; } }
  function setPw(v) { try { sessionStorage.setItem("sm_pw", v); } catch (e) {} }
  function clearPw() { try { sessionStorage.removeItem("sm_pw"); } catch (e) {} }

  function fmtMoney(cents) {
    var n = (cents || 0) / 100;
    return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtDate(unix) {
    if (!unix) return "-";
    var d = new Date(unix * 1000);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  function fmtDateTime(unix) {
    if (!unix) return "-";
    var d = new Date(unix * 1000);
    return d.toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  async function handleLogin() {
    var btn = $("unlockBtn");
    var input = $("pw");
    var err = $("loginErr");
    var pw = (input.value || "").trim();

    err.textContent = "";
    if (!pw) { err.textContent = "Enter your admin password."; input.focus(); return; }

    btn.disabled = true;
    btn.textContent = "Unlocking...";

    setPw(pw);
    try {
      var res = await fetch("/api/sales?hours=1", { headers: { "x-admin-password": pw } });
      if (res.status === 401) {
        err.textContent = "Wrong password.";
        clearPw();
        return;
      }
      if (res.status === 404) {
        err.textContent = "The /api/sales endpoint is missing. Make sure the site is deployed to Vercel (not GitHub Pages).";
        return;
      }
      if (!res.ok) {
        var body = {};
        try { body = await res.json(); } catch (e) {}
        err.textContent = body.error || ("Server error " + res.status + ". Check Vercel env vars (STRIPE_SECRET_KEY, ADMIN_PASSWORD).");
        return;
      }
      showApp();
      await Promise.all([loadPayments(), loadSubscriptions()]);
      startAutoRefresh();
    } catch (e) {
      err.textContent = "Network error - can't reach the server. Confirm the deployment is live.";
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.textContent = "Unlock";
    }
  }

  function showApp() {
    $("gate").style.display = "none";
    $("app").style.display = "block";
  }
  function showGate() {
    $("gate").style.display = "flex";
    $("app").style.display = "none";
    var pw = $("pw");
    if (pw) pw.value = "";
  }
  function signOut() {
    clearPw();
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
    showGate();
  }

  async function loadPayments() {
    var hours = parseInt($("timeFilter").value, 10) || 720;
    setStatus("warn", "Refreshing");
    try {
      var res = await fetch("/api/sales?hours=" + hours, { headers: { "x-admin-password": getPw() } });
      if (res.status === 401) { signOut(); return; }
      if (!res.ok) { setStatus("err", "Error " + res.status); return; }
      var data = await res.json();
      state.payments = data.sales || [];
      state.customFieldLabels = data.customFieldLabels || [];
      state.products = data.products || [];
      populateProductFilter();
      render();
      $("lastUpdated").textContent = "Last updated " + new Date().toLocaleTimeString();
      setStatus("ok", "Live");
    } catch (e) {
      setStatus("err", "Network error");
      console.error(e);
    }
  }

  async function loadSubscriptions() {
    try {
      var res = await fetch("/api/subscriptions", { headers: { "x-admin-password": getPw() } });
      if (!res.ok) { state.subscriptions = []; state.activeCount = 0; state.mrrCents = 0; return; }
      var data = await res.json();
      state.subscriptions = data.subscriptions || [];
      state.activeCount = data.activeCount || 0;
      state.mrrCents = data.mrrCents || 0;
      if (state.activeTab === "subscriptions") render();
    } catch (e) {
      state.subscriptions = [];
      console.error(e);
    }
  }

  function populateProductFilter() {
    var sel = $("productFilter");
    var current = sel.value;
    sel.innerHTML = '<option value="">All Products</option>' +
      state.products.map(function (p) {
        return '<option value="' + escapeHtml(p) + '">' + escapeHtml(p) + '</option>';
      }).join("");
    if (current && state.products.indexOf(current) !== -1) sel.value = current;
  }

  function render() {
    renderKpis();
    renderTable();
  }

  function currentPaymentsFiltered() {
    var q = ($("searchInput").value || "").toLowerCase().trim();
    var prod = $("productFilter").value || "";
    return state.payments.filter(function (s) {
      if (prod && s.product !== prod) return false;
      if (q) {
        var hay = (s.name + " " + s.email + " " + s.phone + " " + s.product + " " +
          Object.values(s.customFields || {}).join(" ")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function renderKpis() {
    var row = $("kpiRow");
    if (state.activeTab === "payments") {
      var list = currentPaymentsFiltered();
      var total = list.reduce(function (s, x) { return s + (x.amount || 0); }, 0);
      row.innerHTML =
        kpi("Total Payments", String(list.length),
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10 L22 10"/></svg>') +
        kpi("Total Revenue", fmtMoney(total),
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M12 2 L12 22 M17 6 C 17 4 15 3 12 3 C 9 3 7 4 7 6.5 C 7 9 9 10 12 10 C 15 10 17 11 17 13.5 C 17 16 15 17 12 17 C 9 17 7 16 7 14"/></svg>');
    } else {
      row.innerHTML =
        kpi("Active Subscriptions", String(state.activeCount),
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M21 12 A9 9 0 1 1 12 3 L15 3 M15 1 L15 5"/></svg>') +
        kpi("MRR (est.)", fmtMoney(state.mrrCents),
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M4 4 L4 20 L20 20 M8 16 L12 10 L15 13 L20 6"/></svg>') +
        kpi("Total (all statuses)", String(state.subscriptions.length),
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<circle cx="12" cy="7" r="4"/><path d="M4 21 C 4 15 20 15 20 21"/></svg>');
    }
  }
  function kpi(label, value, iconSvg) {
    return '<div class="kpi">' +
      '<div class="kpi-icon">' + iconSvg + '</div>' +
      '<div class="kpi-txt">' +
        '<div class="kpi-label">' + escapeHtml(label) + '</div>' +
        '<div class="kpi-value">' + escapeHtml(value) + '</div>' +
      '</div>' +
    '</div>';
  }

  function renderTable() {
    if (state.activeTab === "payments") renderPaymentsTable();
    else renderSubscriptionsTable();
  }

  function renderPaymentsTable() {
    var list = currentPaymentsFiltered();
    var labels = state.customFieldLabels || [];
    if (list.length === 0) {
      $("tableBody").innerHTML = emptyState("No payments yet", "New purchases will appear here automatically.");
      return;
    }
    var extraCols = labels.map(function (l) { return '<th>' + escapeHtml(l) + '</th>'; }).join("");
    var head = '<tr>' +
      '<th>Name</th><th>Email</th><th>Phone</th><th>Amount</th><th>Date</th><th>Product</th>' +
      extraCols +
    '</tr>';
    var rows = list.map(function (s) {
      var cf = s.customFields || {};
      var extras = labels.map(function (l) {
        var v = cf[l];
        return v ? '<td class="muted">' + escapeHtml(v) + '</td>' : '<td class="dash">-</td>';
      }).join("");
      return '<tr>' +
        '<td class="name">' + escapeHtml(s.name || "-") + '</td>' +
        '<td class="email">' + escapeHtml(s.email || "-") + '</td>' +
        '<td class="phone">' + escapeHtml(s.phone || "-") + '</td>' +
        '<td class="amount">' + fmtMoney(s.amount) + '</td>' +
        '<td class="date">' + escapeHtml(fmtDate(s.date)) + '</td>' +
        '<td>' + escapeHtml(s.product || "-") + '</td>' +
        extras +
      '</tr>';
    }).join("");
    $("tableBody").innerHTML = '<table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>';
  }

  function renderSubscriptionsTable() {
    var list = state.subscriptions;
    if (list.length === 0) {
      $("tableBody").innerHTML = emptyState("No subscriptions", "Recurring plans will show here once someone subscribes.");
      return;
    }
    var head = '<tr>' +
      '<th>Name</th><th>Email</th><th>Product</th><th>Amount</th><th>Interval</th>' +
      '<th>Status</th><th>Next renewal</th>' +
    '</tr>';
    var rows = list.map(function (s) {
      var statusCls = "status-badge status-" + s.status;
      return '<tr>' +
        '<td class="name">' + escapeHtml(s.name || "-") + '</td>' +
        '<td class="email">' + escapeHtml(s.email || "-") + '</td>' +
        '<td>' + escapeHtml(s.product || "-") + '</td>' +
        '<td class="amount">' + fmtMoney(s.amount) + '</td>' +
        '<td class="muted">' + escapeHtml(s.interval || "-") + '</td>' +
        '<td><span class="' + statusCls + '">' + escapeHtml(s.status) + '</span></td>' +
        '<td class="date">' + escapeHtml(s.currentPeriodEnd ? fmtDate(s.currentPeriodEnd) : "-") + '</td>' +
      '</tr>';
    }).join("");
    $("tableBody").innerHTML = '<table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>';
  }

  function emptyState(big, sub) {
    return '<div class="empty"><div class="big">' + escapeHtml(big) + '</div><div>' + escapeHtml(sub) + '</div></div>';
  }

  function exportCSV() {
    var isPayments = state.activeTab === "payments";
    var list = isPayments ? currentPaymentsFiltered() : state.subscriptions;
    if (list.length === 0) { toast("Nothing to export", "err"); return; }

    var cols, rows;
    if (isPayments) {
      cols = ["date", "name", "email", "phone", "product", "amount_usd", "currency"];
      var labels = state.customFieldLabels || [];
      cols = cols.concat(labels.map(function (l) { return l.replace(/[^A-Za-z0-9]+/g, "_").toLowerCase(); }));
      cols.push("session_id");
      rows = list.map(function (s) {
        var row = {
          date: fmtDateTime(s.date),
          name: s.name || "",
          email: s.email || "",
          phone: s.phone || "",
          product: s.product || "",
          amount_usd: ((s.amount || 0) / 100).toFixed(2),
          currency: s.currency || "USD",
          session_id: s.id
        };
        var cf = s.customFields || {};
        labels.forEach(function (l) {
          row[l.replace(/[^A-Za-z0-9]+/g, "_").toLowerCase()] = cf[l] || "";
        });
        return row;
      });
    } else {
      cols = ["created", "name", "email", "product", "amount_usd", "interval", "status", "current_period_end", "subscription_id"];
      rows = list.map(function (s) {
        return {
          created: fmtDateTime(s.created),
          name: s.name || "",
          email: s.email || "",
          product: s.product || "",
          amount_usd: ((s.amount || 0) / 100).toFixed(2),
          interval: s.interval || "",
          status: s.status || "",
          current_period_end: s.currentPeriodEnd ? fmtDateTime(s.currentPeriodEnd) : "",
          subscription_id: s.id
        };
      });
    }

    var esc = function (v) {
      var str = String(v == null ? "" : v);
      return /[",\n\r]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
    };
    var csv = [cols.join(",")].concat(rows.map(function (r) {
      return cols.map(function (c) { return esc(r[c]); }).join(",");
    })).join("\r\n");
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "subjectmedia-" + state.activeTab + "-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toast("CSV exported (" + rows.length + " rows)");
  }

  function startAutoRefresh() {
    if (state.timer) clearInterval(state.timer);
    state.timer = setInterval(function () {
      var chk = $("autoRefresh");
      if (chk && chk.checked && document.visibilityState === "visible") {
        loadPayments();
        loadSubscriptions();
      }
    }, 30000);
  }

  function switchTab(name) {
    state.activeTab = name;
    var tabs = document.querySelectorAll(".tab");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle("active", tabs[i].getAttribute("data-tab") === name);
    }
    render();
  }

  function bindEvents() {
    $("unlockBtn").addEventListener("click", handleLogin);
    $("pw").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); handleLogin(); }
    });
    $("exportBtn").addEventListener("click", exportCSV);
    $("lockBtn").addEventListener("click", signOut);
    $("searchInput").addEventListener("input", function () { if (state.activeTab === "payments") render(); });
    $("timeFilter").addEventListener("change", loadPayments);
    $("productFilter").addEventListener("change", function () { if (state.activeTab === "payments") render(); });
    var tabs = document.querySelectorAll(".tab");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener("click", function () { switchTab(this.getAttribute("data-tab")); });
    }
  }

  async function init() {
    bindEvents();
    var pw = getPw();
    if (pw) {
      try {
        var res = await fetch("/api/sales?hours=1", { headers: { "x-admin-password": pw } });
        if (res.ok) {
          showApp();
          await Promise.all([loadPayments(), loadSubscriptions()]);
          startAutoRefresh();
          return;
        }
      } catch (e) {}
      clearPw();
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
